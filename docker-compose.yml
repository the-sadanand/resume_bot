version: "3.9"

services:
  app:
    build: .
    container_name: resume_screening_bot
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./generated:/app/generated
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Optional Redis (set REDIS_ENABLED=true in .env to use)
  redis:
    image: redis:7-alpine
    container_name: resume_screening_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    profiles:
      - with-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

volumes:
  data:
  generated:
